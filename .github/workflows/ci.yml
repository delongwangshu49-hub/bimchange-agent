name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Windows offline tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project and desktop dependencies
        run: python -m pip install -e ".[desktop]"
      - name: Run offline test suite
        run: python -m unittest discover -s tests -v
      - name: Run reproducible quickstart smoke test
        run: python scripts/test_quickstart.py
