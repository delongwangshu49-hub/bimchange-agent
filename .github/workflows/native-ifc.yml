name: Native IFC without CGAL
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: IfcOpenShell/IfcOpenShell
          ref: 1c5b825d8ef05ab9d14a15dac12e9eae2f5a37c2
          path: .native-sources/ifcopenshell
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Open-Cascade-SAS/OCCT
          ref: bd2a789f15235755ce4d1a3b07379a2e062fdc2e
          path: .native-sources/occt
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install isolated build tools
        shell: pwsh
        run: |
          python -m pip install cmake==3.31.6 swig==4.4.1 pefile==2024.8.26 wheel==0.45.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -c constraints-preview.txt ifcopenshell==0.8.5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare and verify sources (bounded downloads)
        shell: pwsh
        timeout-minutes: 10
        run: |
          ./scripts/build_ifcopenshell_no_cgal.ps1 -BuildRoot "$env:RUNNER_TEMP/native-ifc" -Stage Prepare
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Boost and preflight all direct IFC Boost headers
        shell: pwsh
        timeout-minutes: 10
        run: ./scripts/build_ifcopenshell_no_cgal.ps1 -BuildRoot "$env:RUNNER_TEMP/native-ifc" -Stage Boost
      - name: Identify exact runner image for dependency cache
        id: cache-platform
        shell: pwsh
        run: |
          if (-not $env:ImageVersion) { throw 'Missing runner image version for cache identity.' }
          "image=$env:ImageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Restore successful OCCT dependency
        id: occt-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/native-ifc/install/occt
            ${{ runner.temp }}/native-ifc/evidence/OCCT-CMakeCache.txt
          key: occt-781-shared-v1-${{ runner.os }}-${{ steps.cache-platform.outputs.image }}-${{ hashFiles('packaging/native-sources.json') }}
      - name: Build OpenCASCADE shared libraries
        if: steps.occt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        timeout-minutes: 60
        run: ./scripts/build_ifcopenshell_no_cgal.ps1 -BuildRoot "$env:RUNNER_TEMP/native-ifc" -Stage OCCT
      - name: Save successful OCCT before downstream compilation
        if: steps.occt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/native-ifc/install/occt
            ${{ runner.temp }}/native-ifc/evidence/OCCT-CMakeCache.txt
          key: ${{ steps.occt-cache.outputs.cache-primary-key }}
      - name: Build IfcOpenShell without CGAL
        shell: pwsh
        timeout-minutes: 85
        run: ./scripts/build_ifcopenshell_no_cgal.ps1 -BuildRoot "$env:RUNNER_TEMP/native-ifc" -Stage IFC
      - name: Assemble wheel and verify native kernels
        shell: pwsh
        timeout-minutes: 5
        run: ./scripts/build_ifcopenshell_no_cgal.ps1 -BuildRoot "$env:RUNNER_TEMP/native-ifc" -Stage Pack
      - name: Retain build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ifc-evidence
          path: |
            ${{ runner.temp }}/native-ifc/evidence
            ${{ runner.temp }}/native-ifc/*-build/CMakeCache.txt
            ${{ runner.temp }}/native-ifc/*-build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
      - name: Retain private validation wheel
        uses: actions/upload-artifact@v4
        with:
          name: native-ifc-validation
          path: ${{ runner.temp }}/native-ifc/wheels
          if-no-files-found: error
      - name: Retain built dependencies even if IFC fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ifc-built-dependencies
          path: |
            ${{ runner.temp }}/native-ifc/install/occt
            ${{ runner.temp }}/native-ifc/install/boost
            ${{ runner.temp }}/native-ifc/evidence
          if-no-files-found: warn
      - name: Retain downloaded source archives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ifc-sources
          path: ${{ runner.temp }}/native-ifc/archives
          compression-level: 6
          if-no-files-found: error
