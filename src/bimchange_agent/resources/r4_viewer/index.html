<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'">
  <title>BIMChange-Agent · Local 3D</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <aside>
      <h1 id="heading">Local 3D</h1>
      <p id="boundary"></p>
      <div id="change-list" aria-label="Change records"></div>
      <dl id="details"></dl>
    </aside>
    <section class="stage" aria-label="Local 3D scene">
      <canvas id="viewer" aria-label="Actual IFC element geometry"></canvas>
      <div class="topbar">
        <div id="status" role="status"></div>
        <div class="tools" role="toolbar" aria-label="View controls">
          <button id="focus" type="button">Focus element</button>
          <button id="fit" type="button">Fit context</button>
          <button id="fade" type="button" aria-pressed="true">Context faded</button>
        </div>
      </div>
      <div class="legend"><span class="target-dot"></span><span id="legend-target"></span><span class="context-dot"></span><span id="legend-context"></span><span id="grid-scale"></span></div>
      <div id="hint"></div>
    </section>
  </main>
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
  <script type="module" src="app.js"></script>
</body>
</html>
