[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bimchange-agent"
version = "0.5.0"
description = "Evidence-grounded IFC revision analysis for bounded Windows workflows"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "BIMChange-Agent contributors" }]
dependencies = [
  "ifcopenshell==0.8.5",
  "ifcdiff==0.8.5",
  "jsonschema==4.25.1",
]

[project.scripts]
bimchange = "bimchange_agent.cli:main"
bimchange-desktop = "bimchange_agent.desktop_app:main"

[project.optional-dependencies]
desktop = ["PySide6-Essentials==6.11.1"]
desktop-build = [
  "PySide6-Essentials==6.11.1",
  "pyinstaller==6.22.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bimchange_agent = ["resources/*.json", "resources/branding/*.png"]
